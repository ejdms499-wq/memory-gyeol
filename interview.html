<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>기억결 — 기억 인터뷰</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f1eb;
      --paper: rgba(255, 255, 255, 0.72);
      --text: #20201d;
      --sub: #77746d;
      --line: rgba(32, 32, 29, 0.13);
      --accent: #31372f;
      --accent-soft: #dfe3da;
      --danger: #a35151;
    }

    body {
      min-height: 100vh;

      font-family:
        "Pretendard",
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(228, 221, 207, 0.75),
          transparent 33%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(212, 218, 206, 0.6),
          transparent 30%
        ),
        var(--bg);
    }

    button,
    textarea {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===============================
       HEADER
    =============================== */

    .header {
      padding: 28px 42px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 30px;
      height: 30px;

      border: 1px solid rgba(32, 32, 29, 0.25);
      border-radius: 50%;

      position: relative;
    }

    .logo-mark::before {
      content: "";

      position: absolute;
      width: 10px;
      height: 10px;

      left: 5px;
      top: 5px;

      border-radius: 50%;
      background: var(--accent);
      opacity: 0.78;
    }

    .logo-mark::after {
      content: "";

      position: absolute;
      width: 8px;
      height: 8px;

      right: 4px;
      bottom: 4px;

      border: 1px solid var(--accent);
      border-radius: 50%;
    }

    .brand-name {
      font-family:
        Georgia,
        "Times New Roman",
        "Noto Serif KR",
        serif;

      font-size: 21px;
    }

    .step-label {
      font-size: 11px;
      color: var(--sub);
      letter-spacing: 0.12em;
    }

    /* ===============================
       PROGRESS
    =============================== */

    .progress-wrap {
      width: 100%;
      height: 2px;
      background: rgba(32, 32, 29, 0.08);
    }

    .progress-bar {
      width: 12%;
      height: 100%;

      background: var(--accent);

      transition: width 0.5s ease;
    }

    /* ===============================
       MAIN
    =============================== */

    .main {
      width: 100%;
      max-width: 960px;

      margin: 0 auto;
      padding: 70px 30px 60px;

      flex: 1;
    }

    .top-copy {
      margin-bottom: 40px;
    }

    .eyebrow {
      margin-bottom: 14px;

      font-size: 11px;
      color: var(--sub);

      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .top-copy h1 {
      margin-bottom: 14px;

      font-family:
        Georgia,
        "Times New Roman",
        "Noto Serif KR",
        serif;

      font-size: clamp(35px, 5vw, 53px);
      font-weight: 400;

      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .top-copy p {
      color: var(--sub);

      font-size: 14px;
      line-height: 1.8;
    }

    /* ===============================
       ORIGINAL MEMORY
    =============================== */

    .original-memory {
      margin-bottom: 22px;
      padding: 20px 22px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.35);
    }

    .original-label {
      margin-bottom: 8px;

      font-size: 10px;
      color: #99958c;

      letter-spacing: 0.1em;
    }

    #originalRecall {
      font-size: 13px;
      line-height: 1.75;
      color: #66635c;

      word-break: keep-all;
    }

    /* ===============================
       QUESTION CARD
    =============================== */

    .interview-card {
      padding: 36px;

      border: 1px solid rgba(32, 32, 29, 0.12);
      border-radius: 24px;

      background: var(--paper);

      box-shadow:
        0 28px 70px rgba(49, 49, 42, 0.07);

      backdrop-filter: blur(16px);
    }

    .question-meta {
      margin-bottom: 17px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 10px;
      color: #98948b;

      letter-spacing: 0.08em;
    }

    #questionNumber {
      color: #77736b;
    }

    #currentQuestion {
      min-height: 85px;
      margin-bottom: 31px;

      display: flex;
      align-items: center;

      font-family:
        Georgia,
        "Times New Roman",
        "Noto Serif KR",
        serif;

      font-size: clamp(24px, 3vw, 33px);
      line-height: 1.45;
      font-weight: 400;

      letter-spacing: -0.025em;
      word-break: keep-all;
    }

    /* ===============================
       ANSWER
    =============================== */

    .answer-wrap {
      position: relative;
    }

    #answerInput {
      width: 100%;
      min-height: 170px;

      padding: 20px 20px 46px;

      resize: vertical;

      border: 1px solid rgba(32, 32, 29, 0.16);
      border-radius: 14px;

      outline: none;

      color: var(--text);
      background: rgba(250, 249, 246, 0.84);

      font-size: 15px;
      line-height: 1.8;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    #answerInput::placeholder {
      color: #aaa69d;
    }

    #answerInput:focus {
      border-color: rgba(49, 55, 47, 0.45);

      box-shadow:
        0 0 0 4px rgba(49, 55, 47, 0.06);
    }

    .count {
      position: absolute;

      right: 15px;
      bottom: 13px;

      font-size: 10px;
      color: #a29f97;
    }

    .answer-guide {
      margin-top: 13px;

      font-size: 11px;
      line-height: 1.7;
      color: #8c8981;
    }

    /* ===============================
       BUTTONS
    =============================== */

    .actions {
      margin-top: 27px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .back-button {
      border: none;
      background: transparent;

      color: #8b877f;

      font-size: 12px;
      cursor: pointer;
    }

    #sendButton {
      min-width: 155px;

      padding: 15px 22px;

      border: none;
      border-radius: 999px;

      color: #f7f6f2;
      background: var(--accent);

      font-size: 13px;

      cursor: pointer;

      transition:
        transform 0.18s ease,
        opacity 0.18s ease;
    }

    #sendButton:hover {
      transform: translateY(-1px);
    }

    #sendButton:disabled {
      cursor: wait;
      opacity: 0.5;
      transform: none;
    }

    /* ===============================
       STATUS
    =============================== */

    #statusMessage {
      min-height: 20px;
      margin-top: 17px;

      font-size: 12px;
      color: var(--sub);
      line-height: 1.6;
    }

    #statusMessage.error {
      color: var(--danger);
    }

    /* ===============================
       THINKING
    =============================== */

    .thinking {
      display: none;

      margin-bottom: 16px;

      align-items: center;
      gap: 8px;

      color: #88847c;
      font-size: 11px;
    }

    .thinking.visible {
      display: flex;
    }

    .dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;
      background: #797d74;

      animation: pulse 1.1s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* ===============================
       FOOTER
    =============================== */

    .footer {
      padding: 23px 42px 30px;

      display: flex;
      justify-content: space-between;

      font-size: 10px;
      color: #9b978e;
    }

    /* ===============================
       MOBILE
    =============================== */

    @media (max-width: 700px) {
      .header {
        padding: 21px 20px;
      }

      .step-label {
        display: none;
      }

      .main {
        padding: 48px 20px 45px;
      }

      .interview-card {
        padding: 25px 19px;
        border-radius: 20px;
      }

      .actions {
        flex-direction: column-reverse;
        align-items: stretch;
      }

      #sendButton {
        width: 100%;
      }

      .back-button {
        padding: 8px;
      }

      .footer {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="header">

    <div class="brand">
      <div class="logo-mark"></div>
      <div class="brand-name">기억결</div>
    </div>

    <div class="step-label">
      MEMORY INTERVIEW
    </div>

  </header>

  <div class="progress-wrap">
    <div
      id="progressBar"
      class="progress-bar"
    ></div>
  </div>

  <main class="main">

    <section class="top-copy">

      <div class="eyebrow">
        02 · MEMORY INTERVIEW
      </div>

      <h1>
        조금씩, 떠오르는 만큼만.
      </h1>

      <p>
        확실하지 않아도 괜찮아요.
        기억나지 않는다면 그대로 말해주세요.
      </p>

    </section>

    <section class="original-memory">

      <div class="original-label">
        FIRST RECALL
      </div>

      <div id="originalRecall">
        최초 기억을 불러오는 중…
      </div>

    </section>

    <section class="interview-card">

      <div class="question-meta">

        <span id="questionNumber">
          QUESTION 01
        </span>

        <span>
          RECALL FIRST
        </span>

      </div>

      <div id="currentQuestion">
        질문을 불러오는 중…
      </div>

      <div
        id="thinking"
        class="thinking"
      >

        <span>기억을 정리하고 있어요</span>

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

      <form id="answerForm">

        <div class="answer-wrap">

          <textarea
            id="answerInput"
            maxlength="1500"
            autocomplete="off"
            placeholder="떠오르는 만큼만 적어주세요. 예) 있었던 것 같아 / 그건 확실해 / 잘 기억나지 않아."
          ></textarea>

          <div class="count">
            <span id="answerCount">0</span> / 1500
          </div>

        </div>

        <p class="answer-guide">
          기억이 나지 않는 부분도 중요한 정보예요.
          억지로 떠올리려고 하지 않아도 돼요.
        </p>

        <div class="actions">

          <button
            class="back-button"
            id="restartButton"
            type="button"
          >
            ← 처음부터 다시
          </button>

          <button
            id="sendButton"
            type="submit"
          >
            답변 보내기 →
          </button>

        </div>

        <div
          id="statusMessage"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </main>

  <footer class="footer">

    <span>
      MEMORY GYEOL
    </span>

    <span>
      모르는 것은 모르는 상태로 남겨요.
    </span>

  </footer>

</div>


<script>

  /* ==========================================
     n8n Production Webhook
  ========================================== */

  const MEMORY_INTERVIEW_WEBHOOK =
    "https://soykim0516.app.n8n.cloud/webhook/memory-interview";


  /* ==========================================
     sessionStorage
  ========================================== */

  const memoryId =
    sessionStorage.getItem(
      "memoryGyeolMemoryId"
    );

  const originalRecall =
    sessionStorage.getItem(
      "memoryGyeolOriginalRecall"
    );

  let currentQuestion =
    sessionStorage.getItem(
      "memoryGyeolCurrentQuestion"
    );


  /* ==========================================
     DOM
  ========================================== */

  const originalRecallElement =
    document.getElementById(
      "originalRecall"
    );

  const currentQuestionElement =
    document.getElementById(
      "currentQuestion"
    );

  const answerForm =
    document.getElementById(
      "answerForm"
    );

  const answerInput =
    document.getElementById(
      "answerInput"
    );

  const answerCount =
    document.getElementById(
      "answerCount"
    );

  const sendButton =
    document.getElementById(
      "sendButton"
    );

  const statusMessage =
    document.getElementById(
      "statusMessage"
    );

  const questionNumber =
    document.getElementById(
      "questionNumber"
    );

  const thinking =
    document.getElementById(
      "thinking"
    );

  const progressBar =
    document.getElementById(
      "progressBar"
    );

  const restartButton =
    document.getElementById(
      "restartButton"
    );


  let turnNumber = 1;


  /* ==========================================
     초기 데이터 확인
  ========================================== */

  if (!memoryId) {

    window.location.href =
      "./index.html";

  }


  originalRecallElement.textContent =
    originalRecall ||
    "최초 기억 정보가 없어요.";


  currentQuestionElement.textContent =
    currentQuestion ||
    "기억에서 조금 더 떠오르는 것이 있나요?";


  /* ==========================================
     글자 수
  ========================================== */

  answerInput.addEventListener(
    "input",
    () => {

      answerCount.textContent =
        answerInput.value.length;

    }
  );


  /* ==========================================
     상태 메시지
  ========================================== */

  function setStatus(
    message,
    isError = false
  ) {

    statusMessage.textContent =
      message;

    statusMessage.classList.toggle(
      "error",
      isError
    );

  }


  /* ==========================================
     UI 로딩 상태
  ========================================== */

  function setLoading(isLoading) {

    sendButton.disabled =
      isLoading;

    answerInput.disabled =
      isLoading;

    thinking.classList.toggle(
      "visible",
      isLoading
    );

    if (isLoading) {

      sendButton.textContent =
        "기억을 정리하는 중…";

    }
    else {

      sendButton.textContent =
        "답변 보내기 →";

    }

  }


  /* ==========================================
     질문 변경
  ========================================== */

  function showNextQuestion(question) {

    currentQuestion =
      question;

    sessionStorage.setItem(
      "memoryGyeolCurrentQuestion",
      question
    );


    currentQuestionElement.textContent =
      question;


    turnNumber += 1;

    questionNumber.textContent =
      "QUESTION " +
      String(turnNumber).padStart(
        2,
        "0"
      );


    /*
      실제 인터뷰 길이는 기억마다 다르기 때문에
      진행률은 시각적 안내용으로만 사용
    */

    const progress =
      Math.min(
        15 + (turnNumber * 12),
        82
      );

    progressBar.style.width =
      progress + "%";


    answerInput.value = "";

    answerCount.textContent = "0";

    answerInput.focus();

  }


  /* ==========================================
     답변 전송
  ========================================== */

  answerForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const userAnswer =
        answerInput.value.trim();


      if (!userAnswer) {

        setStatus(
          "떠오르는 답변을 적어주세요.",
          true
        );

        answerInput.focus();

        return;

      }


      setLoading(true);

      setStatus(
        "당신이 말한 것만 기억에 반영하고 있어요."
      );


      try {

        const response =
          await fetch(
            MEMORY_INTERVIEW_WEBHOOK,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                memory_id:
                  Number(memoryId),

                question:
                  currentQuestion,

                user_answer:
                  userAnswer
              })
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        /*
          --------------------------------
          CASE 1
          인터뷰 계속
          --------------------------------

          false 분기의 마지막 Update row가
          memories row를 반환함.

          status = interviewing
        */

        if (
          data.status ===
          "interviewing"
        ) {

          let nextQuestion = null;


          if (
            Array.isArray(data.questions) &&
            data.questions.length > 0
          ) {

            nextQuestion =
              data.questions[0];

          }


          if (!nextQuestion) {

            nextQuestion =
              "조금 더 떠오르는 장면이 있나요?";

          }


          showNextQuestion(
            nextQuestion
          );


          setStatus(
            "좋아요. 기억을 조금 더 따라가볼게요."
          );


          setLoading(false);

          return;

        }


        /*
          --------------------------------
          CASE 2
          최종 이미지 생성 완료
          --------------------------------

          TRUE 분기:

          ready
          ↓
          reconstruction brief
          ↓
          이미지 생성
          ↓
          Storage
          ↓
          Update a row3

          최종 응답:
          status = generated
        */

        if (
          data.status ===
          "generated"
        ) {

          progressBar.style.width =
            "100%";


          /*
            result.html에서 사용할
            최종 reconstruction 저장
          */

          sessionStorage.setItem(
            "memoryGyeolResult",
            JSON.stringify(data)
          );


          sessionStorage.setItem(
            "memoryGyeolReconstructionId",
            String(data.id)
          );


          if (data.image_url) {

            sessionStorage.setItem(
              "memoryGyeolImagePath",
              data.image_url
            );

          }


          setStatus(
            "기억의 재구성이 완료됐어요."
          );


          sendButton.textContent =
            "완료";


          /*
            아직 result.html을 만들지 않았으므로
            지금 테스트하면 이동 후 404가 날 수 있음.
          */

          setTimeout(
            () => {

              window.location.href =
                "./result.html";

            },
            700
          );


          return;

        }


        /*
          예상하지 못한 상태
        */

        console.warn(
          "Unexpected response:",
          data
        );


        throw new Error(
          "알 수 없는 응답 상태"
        );

      }

      catch (error) {

        console.error(
          "memory interview error:",
          error
        );


        setStatus(
          "인터뷰 처리 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.",
          true
        );


        setLoading(false);

      }

    }
  );


  /* ==========================================
     처음부터 다시
  ========================================== */

  restartButton.addEventListener(
    "click",
    () => {

      const confirmed =
        window.confirm(
          "현재 인터뷰를 나가고 처음부터 다시 시작할까요?"
        );


      if (!confirmed) {
        return;
      }


      sessionStorage.removeItem(
        "memoryGyeolMemoryId"
      );

      sessionStorage.removeItem(
        "memoryGyeolOriginalRecall"
      );

      sessionStorage.removeItem(
        "memoryGyeolCurrentQuestion"
      );

      sessionStorage.removeItem(
        "memoryGyeolMemory"
      );

      sessionStorage.removeItem(
        "memoryGyeolResult"
      );

      sessionStorage.removeItem(
        "memoryGyeolReconstructionId"
      );

      sessionStorage.removeItem(
        "memoryGyeolImagePath"
      );


      window.location.href =
        "./index.html";

    }
  );

</script>

</body>
</html>
